/* ---------------------------------------------------------
   Monat wechseln durch Scrollen beziehungsweise Wischen
   --------------------------------------------------------- */
let radSumme = 0, radSperre = 0, radLetzte = 0, radGeste = null;
let wischStart = null, wischZeit = 0, wischGerade = 0, wischRand = null;
let zuletztGescrollt = 0, bekannteLage = null, bekannterBereich = null;

function monatWechseln(richtung){
  state.cursor = addMonths(state.cursor, richtung);
  render();
  sicherstellenGeladen();
}
// Nur wechseln, wenn in die gewünschte Richtung nichts mehr zu scrollen
// ist — sonst ließe sich ein hohes Raster nicht mehr durchsehen.
function amAnschlag(c, runter){
  return runter ? (c.scrollTop + c.clientHeight >= c.scrollHeight - 1)
                : (c.scrollTop <= 0);
}
function scrollBereit(e){
  if(state.view !== "monat" || overlayOffen() || !state.membership) return null;
  return e.target.closest ? e.target.closest(".content") : null;
}
// Merkt sich, wann sich der Kalender zuletzt wirklich bewegt hat. Ein
// Scroll-Ereignis ohne Positionsänderung zählt nicht (kommt vor, wenn der
// Browser Ereignisse verspätet ausliefert).
function lageMelden(c){
  // Ein neu gezeichneter Kalenderbereich (erster Aufruf, Monatswechsel) wird
  // nur vermerkt — dass er an einer anderen Stelle steht, ist keine Bewegung.
  if(c !== bekannterBereich){ bekannterBereich = c; bekannteLage = c.scrollTop; return; }
  if(c.scrollTop !== bekannteLage){ bekannteLage = c.scrollTop; zuletztGescrollt = Date.now(); }
}
document.addEventListener("scroll", function(e){
  if(e.target && e.target.classList && e.target.classList.contains("content")) lageMelden(e.target);
}, true);

document.addEventListener("wheel", function(e){
  const c = scrollBereit(e);
  if(!c || !e.deltaY) return;
  const jetzt = Date.now();
  lageMelden(c);
  // Eine neue Radbewegung beginnt, wenn das Rad eine Viertelsekunde still war.
  // Blättern darf nur eine Bewegung, die schon am Rand beginnt, während der
  // Kalender ruht — wie beim Wischen. Der Nachlauf eines Trackpads, das den
  // Kalender eben erst an den Rand geschoben hat, blättert so nie.
  if(jetzt - radLetzte > 250){
    radGeste = { darf: amAnschlag(c, e.deltaY > 0) && jetzt - zuletztGescrollt > 300 };
    radSumme = 0;
  }
  radLetzte = jetzt;
  if(!radGeste.darf || jetzt < radSperre || !amAnschlag(c, e.deltaY > 0)) return;

  radSumme += e.deltaY;
  if(Math.abs(radSumme) >= 50){
    monatWechseln(radSumme > 0 ? 1 : -1);
    radSumme = 0;
    radSperre = jetzt + 400;
    radGeste.darf = false;            // eine Bewegung blättert höchstens einen Monat
  }
}, { passive:true });

document.addEventListener("touchstart", function(e){
  const c = scrollBereit(e);
  wischStart = (c && e.touches.length === 1) ? e.touches[0].clientY : null;
  wischZeit = Date.now();
  // Entscheidend ist, wo der Kalender beim Aufsetzen des Fingers stand —
  // nicht, wo er nach dem Scrollen landet.
  wischRand = c ? { oben: amAnschlag(c, false), unten: amAnschlag(c, true) } : null;
}, { passive:true });

document.addEventListener("touchend", function(e){
  const start = wischStart;
  wischStart = null;
  if(start === null) return;
  const c = scrollBereit(e);
  if(!c || !e.changedTouches || !e.changedTouches.length) return;
  const weg = start - e.changedTouches[0].clientY;   // nach oben gewischt = positiv
  if(Math.abs(weg) < 70 || Date.now() - wischZeit > 800) return;
  // Nur wechseln, wenn der Kalender schon beim Aufsetzen am Rand stand.
  // Sonst hat dieser Wisch gescrollt, und erst der nächste blättert weiter.
  if(!wischRand || !(weg > 0 ? wischRand.unten : wischRand.oben)) return;
  wischGerade = Date.now();                          // den folgenden Klick verwerfen
  monatWechseln(weg > 0 ? 1 : -1);
}, { passive:true });

document.addEventListener("input", function(e){
  if(e.target && e.target.id === "eintrag-text"){
    state.entwurf = e.target.value;
    // Bereich vom letzten Mal vorschlagen — solange niemand von Hand gewählt hat.

document.addEventListener("change", async function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;

  if(!state.importer) return;

  if(el.dataset.act === "ab-datum"){
    state.importer.abDatum = el.value;
    return render();
  }
  if(el.dataset.act === "praefix"){
    state.importer.praefixe[el.dataset.b] = el.value;
    return render();
  }
  if(el.dataset.act === "ics-datei"){
    const datei = el.files && el.files[0];
    if(!datei) return;
    try{
      const text = await datei.text();
      const roh = icsParse(text);
      if(!roh.length) throw new Error("In dieser Datei stehen keine Termine. Ist es der Kalender-Export?");
      const zaehler = praefixeErkennen(roh);
      const praefixe = {};
      // Buchstabe, der zum Kürzel einer Person passt, wird gleich vorgeschlagen.
      Object.keys(zaehler).forEach(b => {
        const treffer = state.members.find(m => (m.kuerzel || m.name).charAt(0).toUpperCase() === b);
        praefixe[b] = treffer ? treffer.id : "lassen";
      });
      state.importer.dateiname = datei.name;
      state.importer.roh = roh;
      state.importer.zaehler = zaehler;
      state.importer.praefixe = praefixe;
      state.importer.fehler = null;
    }catch(err){
      state.importer.fehler = "Datei konnte nicht gelesen werden: " + (err.message || err);
    }
    return render();
  }
});

async function terminSpeichern(){
  dialogLesen();
  const d = state.dialog;
  if(!d.titel.trim()){ d.error = "Bitte einen Titel eintragen."; return render(); }

  let s, e;
  if(d.ganztags){ s = fromInputs(d.vd, "00:00"); e = endOfDay(fromInputs(d.bd, "00:00")); }
  else { s = fromInputs(d.vd, d.vt); e = fromInputs(d.bd, d.bt); }
  if(e < s){ d.error = "Das Ende liegt vor dem Beginn."; return render(); }

  const daten = {
    household_id: state.membership.household_id,
    titel: d.titel.trim(), ort: d.ort.trim(), notiz: d.notiz.trim(),
    ganztags: d.ganztags, start_at: s.toISOString(), end_at: e.toISOString(),
    wiederholung: d.wiederholung,
    wiederholung_bis: d.wiederholung === "keine" ? null : (d.wiederholung_bis || null),
    member_ids: d.member_ids
  };

  state.busy = true; render();
  try{
    let eventId = d.id;
    if(d.id && d.wiederholung !== "keine" && d.umfang === "einzel" && d.occ){
      // Diesen einen Tag aus der Serie nehmen und als eigenen Termin anlegen.
      const serie = state.events.find(x => x.id === d.id);
      const ausnahmen = ((serie && serie.ausnahmen) || []).concat([d.occ]);
      const a = await sb.from("events").update({ ausnahmen }).eq("id", d.id);
      if(a.error) throw a.error;
      daten.created_by = state.session.user.id;
      daten.wiederholung = "keine";
      daten.wiederholung_bis = null;
      const r = await sb.from("events").insert(daten).select("id").single();
      if(r.error) throw r.error;
      eventId = r.data.id;
    }else if(d.id){
      const r = await sb.from("events").update(daten).eq("id", d.id);
      if(r.error) throw r.error;
    }else{
      daten.created_by = state.session.user.id;
      const r = await sb.from("events").insert(daten).select("id").single();
      if(r.error) throw r.error;
      eventId = r.data.id;
    }
    await erinnerungSpeichern(eventId, d.erinnerung);
    state.dialog = null;
    chronikPruefen();
    await neuLaden();
    setToast(d.id ? "Termin gespeichert" : "Termin angelegt");
  }catch(err){ state.dialog.error = err.message || String(err); }
  state.busy = false; render();
}

async function terminLoeschen(){
  const d = state.dialog;
  if(!d || !d.id) return;
  const einzeln = d.wiederholung !== "keine" && d.umfang === "einzel" && d.occ;
  if(!(await frage({
    titel: einzeln ? "Diesen Termin absagen?" : "Termin löschen?",
    text: einzeln ? "Nur " + datumText(d.occ) + " entfällt, die Serie bleibt bestehen."
                  : (d.wiederholung !== "keine" ? "Die ganze Serie wird entfernt." : d.titel),
    knopf: einzeln ? "Absagen" : "Löschen", gefahr: true
  }))) return;
  state.busy = true; render();
  try{
    if(einzeln){
      const serie = state.events.find(x => x.id === d.id);
      const ausnahmen = ((serie && serie.ausnahmen) || []).concat([d.occ]);
      const r = await sb.from("events").update({ ausnahmen }).eq("id", d.id);
      if(r.error) throw r.error;
    }else{
      const r = await sb.from("events").delete().eq("id", d.id);
      if(r.error) throw r.error;
    }
    state.dialog = null;
    chronikPruefen();
    await neuLaden();
    setToast(einzeln ? "Termin abgesagt" : "Termin gelöscht");
  }catch(err){ state.dialog.error = err.message || String(err); }
  state.busy = false; render();
}

// Aus Start- und Endzeit einen Termin an einem bestimmten Tag bauen.
// Liegt das Ende vor dem Beginn, ist der Folgetag gemeint (Nachtdienst).
function vorlageZuTermin(v, datumStr){
  const tag = parseYmd(datumStr);
  const start = fromInputs(datumStr, v.start_zeit);
  let ende = fromInputs(datumStr, v.end_zeit);
  if(ende <= start) ende = addDays(ende, 1);
  return {
    household_id: state.membership.household_id,
    titel: v.titel, notiz: "", ort: "", ganztags: false,
    start_at: start.toISOString(), end_at: ende.toISOString(),
    wiederholung: "keine", wiederholung_bis: null,
    member_ids: v.member_ids || [],
    created_by: state.session.user.id
  };
}

// Wie viele Termine es insgesamt gibt, weiß nur die Datenbank — geladen
// ist immer nur ein Zeitraum.
// Der Haken schaltet sofort um, damit es sich am Wandtablet flüssig
// anfühlt; erst danach geht er an die Datenbank.
async function hakenUmschalten(id, tagStr){
  if(!state.tasks.some(x => x.id === id)) return;
  const vorhanden = state.erledigt.find(h => h.task_id === id && h.tag === tagStr);
  state.erledigt = vorhanden
    ? state.erledigt.filter(h => h !== vorhanden)
    : state.erledigt.concat([{ task_id:id, tag:tagStr, household_id:state.membership.household_id }]);
  render();
  try{
    const r = vorhanden
      ? await sb.from("task_completions").delete().eq("task_id", id).eq("tag", tagStr)
      : await sb.from("task_completions").upsert({
          task_id:id, tag:tagStr,
          household_id: state.membership.household_id,
          erledigt_von: state.session.user.id
        }, { onConflict:"task_id,tag" });
    if(r.error) throw r.error;
    datenSichern();
  }catch(err){
    await aufgabenLaden();          // Stand aus der Datenbank wiederherstellen
    setToast(fehlerText(err));
    render();
  }
}

  const feld = $("#eintrag-text"), sel = $("#eintrag-bereich");
  const text = (feld ? feld.value : "").trim();
  if(!text) return;
  const zeile = {
    household_id: state.membership.household_id, list_id: liste.id, text: text,
    bereich: liste.ist_einkauf ? ((sel && sel.value) || bereichRaten(text)) : ""
  };
  // Sofort zeigen und das Feld leeren — beim Einkaufen tippt man mehrere hintereinander.
  const vorlaeufig = Object.assign({ id:"neu-" + Date.now(), erledigt:false, created_at:new Date().toISOString() }, zeile);
  state.listItems = state.listItems.concat([vorlaeufig]);
  state.entwurf = "";
  render();
  setTimeout(function(){ const f = $("#eintrag-text"); if(f) f.focus(); }, 20);
  try{
    const r = await sb.from("list_items").insert(zeile).select("*").single();
    if(r.error) throw r.error;
    state.listItems = state.listItems.map(e => e === vorlaeufig ? Object.assign({}, vorlaeufig, r.data) : e);
    datenSichern();
  }catch(err){
    state.listItems = state.listItems.filter(e => e !== vorlaeufig);
    state.entwurf = text;
    setToast(fehlerText(err));
    render();
  }
}

async function eintragUmschalten(id){
  const e = state.listItems.find(x => x.id === id); if(!e) return;
  const neu = !e.erledigt;
  state.listItems = state.listItems.map(x => x.id === id ? Object.assign({}, x, { erledigt:neu }) : x);
  render();
  try{
    const r = await sb.from("list_items").update({ erledigt:neu, erledigt_am: neu ? new Date().toISOString() : null }).eq("id", id);
    if(r.error) throw r.error;
    datenSichern();
  }catch(err){
    await listenLaden();
    setToast(fehlerText(err));
    render();
  }
}

async function erledigteEntfernen(){
  const liste = aktiveListe(); if(!liste) return;
  const weg = eintraegeVon(liste).filter(e => e.erledigt);
  if(!weg.length) return;
  state.listItems = state.listItems.filter(e => weg.indexOf(e) < 0);
  render();
  try{
    const r = await sb.from("list_items").delete().eq("list_id", liste.id).eq("erledigt", true);
    if(r.error) throw r.error;
    datenSichern();
    setToast(weg.length + (weg.length === 1 ? " Eintrag" : " Einträge") + " entfernt");
  }catch(err){
    await listenLaden();
    setToast(fehlerText(err));
    render();
  }
}

async function eintragSpeichern(){
  eintragLesen();
  const e = state.eintrag;
  if(!e.text.trim()) return;
  try{
    const r = await sb.from("list_items").update({ text:e.text.trim(), bereich:e.bereich || "" }).eq("id", e.id);
    if(r.error) throw r.error;
    state.eintrag = null; chronikPruefen();
    await listenLaden(); datenSichern();
  }catch(err){ setToast(fehlerText(err)); }
  render();
}

async function eintragLoeschen(){
  const e = state.eintrag; if(!e) return;
  try{
    const r = await sb.from("list_items").delete().eq("id", e.id);
    if(r.error) throw r.error;
    state.eintrag = null; chronikPruefen();
    await listenLaden(); datenSichern();
  }catch(err){ setToast(fehlerText(err)); }
  render();
}

async function listeAnlegen(){
  const name = await frage({ titel:"Neue Liste", text:"Zum Beispiel „Packen Urlaub“ oder „Baumarkt“.", feld:"", platzhalter:"Name", knopf:"Anlegen" });
  if(!name || !String(name).trim()) return;
  try{
    const r = await sb.from("lists").insert({
      household_id: state.membership.household_id, name: String(name).trim(),
      ist_einkauf: !state.lists.some(l => l.ist_einkauf), sortierung: state.lists.length
    }).select("*").single();
    if(r.error) throw r.error;
    await listenLaden();
    if(r.data && r.data.id){ state.listeAktiv = r.data.id; localStorage.setItem("fp.liste", r.data.id); }
    datenSichern();
  }catch(err){ setToast(fehlerText(err)); }
  render();
}

async function listeSpeichern(){
  const l = state.listeDialog; if(!l) return;
  const name = ($("#li-name") ? $("#li-name").value : l.name).trim();
  const einkauf = $("#li-einkauf") ? $("#li-einkauf").checked : l.ist_einkauf;
  if(!name) return;
  try{
    // Es gibt nur eine Einkaufsliste: vorher bei allen anderen austragen.
    if(einkauf){
      const a = await sb.from("lists").update({ ist_einkauf:false })
        .eq("household_id", state.membership.household_id).neq("id", l.id);
      if(a.error) throw a.error;
    }
    const r = await sb.from("lists").update({ name, ist_einkauf:einkauf }).eq("id", l.id);
    if(r.error) throw r.error;
    state.listeDialog = null; chronikPruefen();
    await listenLaden(); datenSichern();
  }catch(err){ setToast(fehlerText(err)); }
  render();
}

async function listeLoeschen(){
  const l = state.listeDialog; if(!l) return;
  const anzahl = state.listItems.filter(e => e.list_id === l.id).length;
  if(!(await frage({ titel:"Liste „" + l.name + "“ löschen?",
                     text: anzahl ? "Mit allen " + anzahl + " Einträgen." : "Sie ist leer.",
                     knopf:"Löschen", gefahr:true }))) return;
  try{
    const r = await sb.from("lists").delete().eq("id", l.id);
    if(r.error) throw r.error;
    state.listeDialog = null; chronikPruefen();
    if(state.listeAktiv === l.id){ state.listeAktiv = null; localStorage.removeItem("fp.liste"); }
    await listenLaden(); datenSichern();
  }catch(err){ setToast(fehlerText(err)); }
  render();
}

async function zaehlerLaden(){
  try{
    const hid = state.membership.household_id;
    const [alle, importiert] = await Promise.all([
      sb.from("events").select("id", { count:"exact", head:true }).eq("household_id", hid),
      sb.from("events").select("id", { count:"exact", head:true }).eq("household_id", hid).not("extern_uid", "is", null)
    ]);
    state.zaehler = { gesamt: alle.count || 0, importiert: importiert.count || 0 };
    render();
  }catch(err){ /* Knöpfe bleiben dann ohne Zahl */ }
}

async function termineLoeschen(nurImportierte){
  const z = state.zaehler || { gesamt:0, importiert:0 };
  const betroffen = nurImportierte ? z.importiert : z.gesamt;
  if(!betroffen) return;

  const text = nurImportierte
    ? betroffen + " importierte Termine löschen? Von Hand angelegte bleiben erhalten."
    : "Wirklich ALLE " + betroffen + " Termine im Haushalt „" + (state.household ? state.household.name : "") + "“ löschen?";
  if(!(await frage({ titel: nurImportierte ? "Importierte Termine löschen?" : "Alle Termine löschen?",
                     text: text + " Das lässt sich nicht rückgängig machen.",
                     knopf:"Löschen", gefahr:true }))) return;

  state.busy = true; render();
  try{
    let q = sb.from("events").delete().eq("household_id", state.membership.household_id);
    if(nurImportierte) q = q.not("extern_uid", "is", null);
    const r = await q;
    if(r.error) throw r.error;
    await neuLaden();
    setToast(betroffen + " Termine gelöscht");
  }catch(err){
    setToast("Fehler: " + (err.message || err));
  }
  state.busy = false; render();
}

async function einstellungenSpeichern(){
  // Alle Felder einsammeln, bevor render() sie ersetzt.
  const hhName = $("#st-hh") ? $("#st-hh").value.trim() : "";
  const gelesen = [];
  document.querySelectorAll(".memberrow").forEach(row=>{
    const v = f => row.querySelector('[data-f="' + f + '"]');
    const m = memberById(row.dataset.mid);
    if(!m) return;
    // Kategoriezeilen haben kein Kind-Häkchen — fehlende Felder behalten
    // den bisherigen Wert, statt den Lesevorgang abzubrechen.
    gelesen.push({
      id: m.id,
      name:    v("name")     ? v("name").value.trim()    : m.name,
      kuerzel: v("kuerzel")  ? v("kuerzel").value.trim() : m.kuerzel,
      farbe:   v("farbe")    ? v("farbe").value          : m.farbe,
      ist_kind: v("ist_kind") ? v("ist_kind").checked    : m.ist_kind
    });
  });

  // Ladenbereiche in der angezeigten Reihenfolge einsammeln
  const bereichZeilen = Array.from(document.querySelectorAll(".bereichrow")).map(r => ({
    alt: r.dataset.alt || "", neu: (r.querySelector("input").value || "").trim()
  })).filter(b => b.neu);
  const bereicheNeu = bereichZeilen.map(b => b.neu).filter((b, i, a) => a.indexOf(b) === i);

  const vorlagen = [];
  document.querySelectorAll(".vorlagerow").forEach(row=>{
    const v = f => row.querySelector('[data-f="' + f + '"]');
    const alt = state.templates.find(x => x.id === row.dataset.vid);
    if(!alt) return;
    const mid = v("member") ? v("member").value : "";
    vorlagen.push({
      id: alt.id,
      titel: v("titel") ? v("titel").value.trim() || alt.titel : alt.titel,
      member_ids: mid ? [mid] : [],
      start_zeit: v("start_zeit") ? v("start_zeit").value : alt.start_zeit,
      end_zeit:   v("end_zeit")   ? v("end_zeit").value   : alt.end_zeit
    });
  });

  state.busy = true; render();
  try{
    if(hhName && state.household && hhName !== state.household.name){
      const r = await sb.from("households").update({ name: hhName }).eq("id", state.household.id);
      if(r.error) throw r.error;
    }
    for(const g of gelesen){
      const m = memberById(g.id);
      if(!m) continue;
      const neu = { name: g.name || m.name, kuerzel: g.kuerzel, farbe: g.farbe, ist_kind: g.ist_kind };
      if(neu.name !== m.name || neu.kuerzel !== m.kuerzel || neu.farbe !== m.farbe || neu.ist_kind !== m.ist_kind){
        const r = await sb.from("members").update(neu).eq("id", g.id);
        if(r.error) throw r.error;
      }
    }
    if(document.getElementById("bereichliste") && bereicheNeu.join("\n") !== ladenbereiche().join("\n")){
      const r = await sb.from("households").update({ ladenbereiche: bereicheNeu }).eq("id", state.household.id);
      if(r.error) throw r.error;
      // Umbenannte Bereiche auch bei den vorhandenen Einträgen nachziehen.
      for(const b of bereichZeilen){
        if(b.alt && b.alt !== b.neu){
          const u = await sb.from("list_items").update({ bereich:b.neu })
            .eq("household_id", state.membership.household_id).eq("bereich", b.alt);
          if(u.error) throw u.error;
        }
      }
    }
    for(const g of vorlagen){
      const alt = state.templates.find(x => x.id === g.id);
      if(!alt) continue;
      if(g.titel !== alt.titel || g.start_zeit !== alt.start_zeit || g.end_zeit !== alt.end_zeit ||
         (g.member_ids[0] || "") !== (alt.member_ids[0] || "")){
        const r = await sb.from("templates").update({
          titel: g.titel, member_ids: g.member_ids,
          start_zeit: g.start_zeit, end_zeit: g.end_zeit
        }).eq("id", g.id);
        if(r.error) throw r.error;
      }
    }
    await neuLaden();
    state.settings = false;
    chronikPruefen();
    setToast("Gespeichert");
  }catch(err){ setToast("Fehler: " + (err.message || err)); }
  state.busy = false; render();
}

async function importAusfuehren(){
  const vor = importVorbereiten();
  if(!vor.rows.length) return;

  state.busy = true; render();
  let neu = 0, fehler = null;
  try{
    for(let i = 0; i < vor.rows.length; i += 200){
      const teil = vor.rows.slice(i, i + 200);
      const r = await sb.from("events")
        .upsert(teil, { onConflict: "household_id,extern_uid", ignoreDuplicates: true })
        .select("id");
      if(r.error) throw r.error;
      neu += (r.data || []).length;
    }
    await neuLaden();
  }catch(err){
    fehler = err.message || String(err);
  }
  state.busy = false;

  if(fehler){
    state.importer.fehler = fehler;
  }else{
    const u = vor.uebersprungen;
    state.importer.bericht = {
      neu: neu,
      bekannt: vor.rows.length - neu,
      uebersprungen: u.ausserhalb + u.serienausnahme + u.abgesagt + u.ohneDatum,
      hinweise: vor.hinweise
    };
  }
  render();
}

async function neuLaden(){
  const hid = state.membership.household_id;
  const f = state.fenster || { von: addMonths(startOfDay(new Date()), -FENSTER_ZURUECK),
                               bis: addMonths(startOfDay(new Date()),  FENSTER_VORAUS) };
  const [hh, mem, ev, tpl] = await Promise.all([
    sb.from("households").select("*").eq("id", hid).maybeSingle(),
    sb.from("members").select("*").eq("household_id", hid).order("sortierung").order("name"),
    termineAbfragen(hid, f.von, f.bis),
    sb.from("templates").select("*").eq("household_id", hid).order("sortierung").order("titel")
  ]);
  if(hh.data)  state.household = hh.data;
  if(mem.data) state.members = mem.data;
  state.events = ev;
  state.fenster = f;
  if(tpl.data) state.templates = tpl.data;
  const rem = await sb.from("reminders").select("*").eq("user_id", state.session.user.id);
  if(rem.data) state.reminders = rem.data;
  await aufgabenLaden();
  await listenLaden();
  datenSichern();
}

/* =========================================================
   12. Start
   ========================================================= */
let ladeTimer = null;
// Laden mit automatischem Wiederholen: ein kurzer Netzausfall soll sich
// von selbst erholen, ohne dass jemand die Seite neu lädt.
async function ladenMitWiederholung(neuZeichnen){
  clearTimeout(ladeTimer);
  if(!state.session) return;
  state.busy = !!neuZeichnen;
  if(neuZeichnen) render();
  try{
    await loadAll();
    state.ladefehler = null;
    state.offline = false;
    datenSichern();
  }catch(err){
    state.ladefehler = (err && err.message) ? err.message : String(err);
    state.offline = true;
    // Kein Zugriff, aber ein gespeicherter Stand? Dann den zeigen, statt
    // eine Fehlerseite — genau dafür liegt er im Gerät.
    if(!state.membership) datenLaden();
    ladeTimer = setTimeout(function(){ ladenMitWiederholung(true); }, 15000);
  }
  state.busy = false;
  if(neuZeichnen) render();
}

async function start(){
  if(!sb){ render(); return; }
  const { data } = await sb.auth.getSession();
  state.session = data.session || null;
  if(state.session){
    // Erst der gespeicherte Stand — dann wird im Hintergrund aufgefrischt.
    if(datenLaden()){ state.ready = true; render(); }
    await ladenMitWiederholung(false);
  }
  state.ready = true; render();
  zeitgeberStarten();
  dienstRegistrieren();
  pushPruefen().then(render).catch(() => {});

  sb.auth.onAuthStateChange(async (_evt, session)=>{
    const vorher = state.session ? state.session.user.id : null;
    state.session = session || null;
    if(state.session && state.session.user.id !== vorher){
      await ladenMitWiederholung(false);
    }
    render();
  });

  // Bei Rückkehr auf das Wandtablet still abgleichen
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden && state.membership) refreshQuiet();
  });

  window.addEventListener("offline", function(){ state.offline = true; renderImHintergrund(); });
  window.addEventListener("online", function(){
    state.offline = false;
    if(state.membership) refreshQuiet(); else ladenMitWiederholung(true);
    renderImHintergrund();
  });
}

// Der Hintergrunddienst hält die App offline verfügbar — unabhängig davon,
// ob dieses Gerät Erinnerungen bekommt.
function dienstRegistrieren(){
  if(!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

/* ---------------------------------------------------------
   Zeitgeber — für Geräte, die dauernd laufen (Wandtablet):
   Tageswechsel nachführen und ab und zu still abgleichen.
   --------------------------------------------------------- */
let letzterTag = null, letzteBedienung = Date.now(), abgleichZaehler = 0;
let hintergrundStart = null;
document.addEventListener("pointerdown", function(e){
  letzteBedienung = Date.now();
  const b = e.target.closest ? e.target.closest('[data-act="backdrop"]') : null;
  hintergrundStart = (b && e.target === b) ? b : null;
}, true);

function zeitgeberStarten(){
  letzterTag = ymd(new Date());
  setInterval(function(){
    if(!state.membership) return;
    const heute = ymd(new Date());
    if(heute !== letzterTag){
      letzterTag = heute;
      // Liegt die letzte Bedienung lange zurück, zeigt das Gerät wieder
      // den heutigen Tag. Wer gerade blättert, wird nicht gestört.
      if(!overlayOffen() && Date.now() - letzteBedienung > 10 * 60000) state.cursor = new Date();
      renderImHintergrund();
    }
    // Sicherheitsnetz: Live-Änderungen können nach einem Verbindungsabbruch
    // ausbleiben. Alle fünf Minuten nachziehen.
    if(!document.hidden && (++abgleichZaehler % 5 === 0)) refreshQuiet();
  }, 60000);
}
render();
start();

})();
